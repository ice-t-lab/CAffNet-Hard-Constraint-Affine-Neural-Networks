# yaml-language-server: $schema=../../utils/cfg_schema.json

scenario:
  id: opt
  name: optimization solver

system:
  x_dim: 3
  y_dim: 5
  num_ineq: 5
  num_eq: 3

net:
  default: ff
  ff:
    hidden_dims: [200, 200, 200]
    activation: relu
    dropout: 0.2
    batch_norm: true
  tf:
    d_model: 120
    num_heads: 3
    activation: relu
    dropout: 0.0

simulation:
  seed: 1
  data:
    n_train: 1000
    n_validation: 10
    n_eval: 1000
    train_range: [-1, 1]
    eval_range: [-1, 1]
  training:
    lr: 0.0001
    n_epochs: 10000
    batch_size: 1000
    soft_weight: 100
    resume: false
  logging:
    log_freq: 100
    save_freq: 20000
  save:
    config: true
    training_samples: false
    evaluation_samples: false
    model_state: true
    optimizer_state: false
    rng_state: false
    loss_history: true
    predictions: false
    controls: false
    metrics: true
    figures: false

visualization: {}
