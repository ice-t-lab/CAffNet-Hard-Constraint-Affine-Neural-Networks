# yaml-language-server: $schema=../../utils/cfg_schema.json

scenario:
  id: pwc
  name: piecewise constraints

system:
  x_dim: 1
  y_dim: 1

net:
  default: ff
  ff:
    hidden_dims: [200, 200, 200]
    activation: relu
    dropout: 0.0
  tf:
    d_model: 120
    num_heads: 3
    activation: relu
    dropout: 0.0

simulation:
  seed: 1
  data:
    n_train: 50
    n_eval: 400
    train_range: [-2, 2]
    eval_range: [-2, 2]
  training:
    lr: 0.0001
    n_epochs: 50000
    batch_size: 500
    soft_weight: 100
    resume: false
  logging:
    log_freq: 5000
    save_freq: 100000
  save:
    config: true
    training_samples: false
    evaluation_samples: false
    model_state: true
    optimizer_state: false
    rng_state: false
    loss_history: true
    predictions: false
    controls: false
    metrics: true
    figures: true

visualization:
  problem:
    figsize: [6, 4]
    dpi: 300
    xlim: [-2, 2]
    ylim: [-6, 5]
    xlabel: x
    ylabel: y
    grid: false
    label_fontsize: 10
    tick_fontsize: 10
    legend_fontsize: 10
  result:
    linewidth: 2
    alpha: 0.8
    legend_loc: upper center
    legend_bbox_to_anchor: [0.5, 0.25]
    legend_ncol: 3
    legend_frameon: true
    legend_fontsize: 10
    method_styles:
      NN:
        color: red
        linestyle: "-"
        linewidth: 2
        label: NN
      HardNet:
        color: orange
        linestyle: "-"
        linewidth: 2
        label: HardNet
      CAffNet_FF:
        color: blue
        linestyle: "-"
        linewidth: 2
        label: CAffNet-FF
      CAffNet_TF:
        color: green
        linestyle: "-"
        linewidth: 2
        label: CAffNet-TF
  loss_history:
    figsize: [8, 4]
    dpi: 300
    first_n_epochs: 4000
    terms: [main_loss]
    use_epoch: false
    xlabel: Epoch
    ylabel: Total Loss
    grid: false
    label_fontsize: 10
    tick_fontsize: 10
    legend_fontsize: 12
    linewidth: 3
    alpha: 0.75
    method_styles:
      NN:
        color: "#000000"
        linestyle: ":"
        linewidth: 3
        label: NN
      HardNet:
        color: "#0072B2"
        linestyle: "-."
        linewidth: 3
        label: HardNet
      CAffNet_FF:
        color: "#0400E6"
        linestyle: "--"
        linewidth: 3
        label: CAffNet-FF
      CAffNet_TF:
        color: "#EBD000"
        linestyle: "-"
        linewidth: 3
        label: CAffNet-TF
